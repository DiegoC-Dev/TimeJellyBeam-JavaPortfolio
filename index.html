<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TimeJellyBeam - Java Portfolio</title>
    <!-- CheerpJ WebAssembly Loader (4.2 with WebAudio support) -->
    <script src="https://cjrtnc.leaningtech.com/4.2/loader.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #0b0b10;
            color: #ef3081;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
        }
        body.is-touch {
            flex-direction: column;
            gap: 10px;
        }
        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #ef3081;
            background-color: #0b0b10;
            z-index: 10;
        }
        .jelly-loader {
            width: 50px;
            height: 50px;
            border-radius: 50% 50% 40% 40%;
            background: linear-gradient(135deg, #ef3081, #00a78e);
            animation: pulse 0.8s ease-in-out infinite alternate;
            margin-bottom: 20px;
            box-shadow: 0 0 24px rgba(239, 48, 129, 0.55);
        }
        @keyframes pulse {
            0% {
                transform: scale(0.92);
                opacity: 0.75;
            }
            100% {
                transform: scale(1.08);
                opacity: 1;
            }
        }
        #game-wrapper {
            box-shadow: 0 0 35px rgba(239, 48, 129, 0.35);
            border-radius: 10px;
            overflow: hidden;
            flex-shrink: 0;
        }
        body.is-touch #game-wrapper {
            touch-action: none;
        }
        #start-btn {
            display: none;
            margin-top: 18px;
            padding: 12px 28px;
            font-size: 1.05rem;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, #ef3081, #00a78e);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 18px rgba(239, 48, 129, 0.45);
            transition: transform 0.15s ease, opacity 0.15s ease;
        }
        #start-btn:hover {
            transform: scale(1.04);
        }
        #mobile-controls {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 18px;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            flex-shrink: 0;
        }
        body.is-touch #mobile-controls {
            display: flex;
        }
        .dpad-grid {
            display: grid;
            grid-template-columns: repeat(3, 56px);
            grid-template-rows: repeat(3, 44px);
            gap: 6px;
        }
        .dpad-btn {
            background: #171226;
            color: #ef3081;
            border: 2px solid #00a78e;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 3px 10px rgba(0, 167, 142, 0.25);
            transition: transform 0.06s ease, background-color 0.06s ease;
        }
        .dpad-btn:active, .dpad-btn.active {
            background: #ef3081;
            color: #ffffff;
            border-color: #ef3081;
            transform: scale(0.94);
        }
        .dpad-up    { grid-column: 2; grid-row: 1; }
        .dpad-left  { grid-column: 1; grid-row: 2; }
        .dpad-right { grid-column: 3; grid-row: 2; }
        .dpad-down  { grid-column: 2; grid-row: 3; }
        .action-col {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .action-btn {
            width: 68px;
            height: 44px;
            font-size: 13px;
            letter-spacing: 0.4px;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="jelly-loader"></div>
        <p id="loading-text">Cargando TimeJellyBeam en el navegador...</p>
        <button id="start-btn" type="button">Iniciar juego (con sonido)</button>
    </div>
    <div id="game-wrapper"></div>

    <div id="mobile-controls" aria-label="Controles táctiles">
        <div class="dpad-grid">
            <button type="button" class="dpad-btn dpad-up" data-key="ArrowUp" data-code="38" aria-label="Arriba">&#9650;</button>
            <button type="button" class="dpad-btn dpad-left" data-key="ArrowLeft" data-code="37" aria-label="Izquierda">&#9664;</button>
            <button type="button" class="dpad-btn dpad-right" data-key="ArrowRight" data-code="39" aria-label="Derecha">&#9654;</button>
            <button type="button" class="dpad-btn dpad-down" data-key="ArrowDown" data-code="40" aria-label="Abajo">&#9660;</button>
        </div>
        <div class="action-col">
            <button type="button" class="dpad-btn action-btn" data-key="KeyP" data-code="80" aria-label="Pausa">Pausa</button>
            <button type="button" class="dpad-btn action-btn" data-key="Escape" data-code="27" aria-label="Saltar">Skip</button>
        </div>
    </div>

    <script>
        const isTouchDevice = window.matchMedia('(pointer: coarse)').matches
            || ('ontouchstart' in window && navigator.maxTouchPoints > 0);

        if (isTouchDevice) {
            document.body.classList.add('is-touch');
        }

        function getViewportDisplaySize() {
            const controlsReserve = isTouchDevice ? 164 : 0;
            const availW = Math.max(320, window.innerWidth - 16);
            const availH = Math.max(180, window.innerHeight - 16 - controlsReserve);
            let w = Math.min(1280, availW);
            let h = Math.round(w * (768 / 1366));
            if (h > availH) {
                h = availH;
                w = Math.round(h * (1366 / 768));
            }
            return { w, h };
        }

        function unlockWebAudio() {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx && !window.__unlockedAudioCtx) {
                try {
                    const ctx = new AudioCtx();
                    if (ctx.state === 'suspended') {
                        ctx.resume();
                    }
                    window.__unlockedAudioCtx = ctx;
                } catch (e) {}
            }
        }
        window.addEventListener('pointerdown', unlockWebAudio, { once: true });
        window.addEventListener('keydown', function (e) {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
                e.preventDefault();
            }
        }, { passive: false });

        function dispatchVirtualKey(type, keyName, keyCode) {
            const target = (document.activeElement && document.activeElement !== document.body)
                ? document.activeElement
                : (document.querySelector('#game-wrapper [tabindex]') || document);
            const evt = new KeyboardEvent(type, {
                key: keyName,
                code: keyName,
                keyCode: keyCode,
                which: keyCode,
                bubbles: true,
                cancelable: true
            });
            target.dispatchEvent(evt);
        }

        document.querySelectorAll('.dpad-btn').forEach(function (btn) {
            const keyName = btn.dataset.key;
            const keyCode = parseInt(btn.dataset.code, 10);

            function handlePress(e) {
                e.preventDefault();
                unlockWebAudio();
                btn.classList.add('active');
                dispatchVirtualKey('keydown', keyName, keyCode);
            }

            function handleRelease(e) {
                e.preventDefault();
                btn.classList.remove('active');
                dispatchVirtualKey('keyup', keyName, keyCode);
            }

            btn.addEventListener('touchstart', handlePress, { passive: false });
            btn.addEventListener('touchend', handleRelease, { passive: false });
            btn.addEventListener('touchcancel', handleRelease, { passive: false });
            btn.addEventListener('mousedown', handlePress);
            btn.addEventListener('mouseup', handleRelease);
        });

        // Swipe gestures on game board (supports chained swipes without blocking menu taps)
        (function setupSwipeControls() {
            const gameEl = document.getElementById('game-wrapper');
            if (!gameEl) return;
            const SWIPE_THRESHOLD = 24;
            let startX = 0;
            let startY = 0;
            let tracking = false;

            gameEl.addEventListener('touchstart', function (e) {
                if (e.touches.length !== 1) {
                    tracking = false;
                    return;
                }
                unlockWebAudio();
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                tracking = true;
            }, { passive: true });

            gameEl.addEventListener('touchmove', function (e) {
                if (!tracking || e.touches.length !== 1) return;
                const curX = e.touches[0].clientX;
                const curY = e.touches[0].clientY;
                const dx = curX - startX;
                const dy = curY - startY;

                if (Math.abs(dx) < SWIPE_THRESHOLD && Math.abs(dy) < SWIPE_THRESHOLD) {
                    return;
                }

                e.preventDefault();
                let keyName, keyCode;
                if (Math.abs(dx) > Math.abs(dy)) {
                    keyName = dx > 0 ? 'ArrowRight' : 'ArrowLeft';
                    keyCode = dx > 0 ? 39 : 37;
                } else {
                    keyName = dy > 0 ? 'ArrowDown' : 'ArrowUp';
                    keyCode = dy > 0 ? 40 : 38;
                }

                dispatchVirtualKey('keydown', keyName, keyCode);
                setTimeout(function () {
                    dispatchVirtualKey('keyup', keyName, keyCode);
                }, 100);

                startX = curX;
                startY = curY;
            }, { passive: false });

            gameEl.addEventListener('touchend', function () {
                tracking = false;
            }, { passive: true });

            gameEl.addEventListener('touchcancel', function () {
                tracking = false;
            }, { passive: true });
        })();

        async function run() {
            try {
                const { w, h } = getViewportDisplaySize();
                const wrapper = document.getElementById('game-wrapper');
                wrapper.style.width = `${w}px`;
                wrapper.style.height = `${h}px`;

                await cheerpjInit();
                cheerpjCreateDisplay(w, h, wrapper);

                const loading = document.getElementById('loading');
                const loadingText = document.getElementById('loading-text');
                const startBtn = document.getElementById('start-btn');
                if (loadingText) loadingText.textContent = 'Listo para iniciar';
                if (startBtn) {
                    startBtn.style.display = 'inline-block';
                    await new Promise((resolve) => {
                        startBtn.addEventListener('click', () => {
                            unlockWebAudio();
                            resolve();
                        }, { once: true });
                    });
                }
                if (loading) loading.style.display = 'none';
                await cheerpjRunJar("/app/TimeJellyBeam.jar");
            } catch (err) {
                console.error("Error al iniciar CheerpJ:", err);
                const loading = document.getElementById('loading');
                if (loading) loading.innerHTML = '<p style="color: #ff4444;">Error al cargar el juego: ' + (err.message || err) + '</p>';
            }
        }
        run();
    </script>
</body>
</html>
